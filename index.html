<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اختبار قصير | أساسيات الحاسب</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Cairo", sans-serif;
            background: linear-gradient(135deg, #eef4ff, #f8fbff);
            min-height: 100vh;
            color: #1e293b;
        }

        header {
            background: linear-gradient(135deg, #1d4ed8, #2563eb, #3b82f6);
            color: white;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        header h1 {
            font-size: 28px;
            font-weight: 800;
        }

        header p {
            margin-top: 5px;
            font-size: 15px;
            opacity: 0.9;
        }

        .timer {
            margin: 15px auto 0;
            width: fit-content;
            background: rgba(255, 255, 255, 0.18);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 700;
        }

        .container {
            width: 95%;
            max-width: 900px;
            margin: 35px auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
            margin-bottom: 25px;
        }

        .start-card {
            text-align: center;
        }

        .start-card h2 {
            color: #1d4ed8;
            margin-bottom: 15px;
        }

        .start-card p {
            color: #64748b;
            line-height: 2;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            max-width: 500px;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: "Cairo", sans-serif;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: #2563eb;
        }

        button {
            font-family: "Cairo", sans-serif;
            border: none;
            cursor: pointer;
        }

        .start-btn {
            display: block;
            margin: 20px auto 0;
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
            padding: 13px 40px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            transition: 0.3s;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.3);
        }

        #quiz,
        #result {
            display: none;
        }

        .progress-container {
            margin-bottom: 25px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
            color: #64748b;
        }

        .progress-bar {
            width: 100%;
            height: 9px;
            background: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, #1d4ed8, #60a5fa);
            width: 0%;
            transition: width 0.3s;
        }

        .question {
            font-size: 21px;
            font-weight: 700;
            line-height: 1.9;
            margin-bottom: 25px;
            color: #0f172a;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            padding: 15px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            background: white;
            font-size: 16px;
        }

        .option:hover {
            border-color: #93c5fd;
            background: #f8fbff;
        }

        .option.selected {
            border-color: #2563eb;
            background: #eff6ff;
            color: #1d4ed8;
            font-weight: 700;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 15px;
        }

        .nav-btn {
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            background: #e2e8f0;
            color: #334155;
        }

        .next-btn {
            background: #2563eb;
            color: white;
        }

        .finish-btn {
            background: #16a34a;
            color: white;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* النتيجة */
        .result-card {
            text-align: center;
        }

        .result-card h2 {
            color: #1d4ed8;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1d4ed8, #60a5fa);
            color: white;
            margin: 0 auto 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.25);
        }

        .score-circle span:first-child {
            font-size: 34px;
            font-weight: 800;
        }

        .score-circle span:last-child {
            font-size: 14px;
            opacity: 0.9;
        }

        .percentage {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #334155;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px auto;
            max-width: 500px;
        }

        .stat {
            background: #f8fafc;
            border-radius: 12px;
            padding: 18px;
        }

        .stat strong {
            display: block;
            font-size: 28px;
        }

        .stat.correct strong {
            color: #16a34a;
        }

        .stat.wrong strong {
            color: #dc2626;
        }

        .stat span {
            color: #64748b;
            font-size: 14px;
        }

        #resultMessage {
            margin: 20px 0;
            font-size: 18px;
            font-weight: 700;
        }

        /* الأسئلة الخاطئة */
        #wrongQuestions {
            margin-top: 35px;
            text-align: right;
        }

        .wrong-title {
            color: #b91c1c;
            font-size: 22px;
            margin-bottom: 20px;
            text-align: center;
        }

        .wrong-question {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-right: 5px solid #ef4444;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.06);
        }

        .question-number {
            display: inline-block;
            background: #eff6ff;
            color: #2563eb;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .question-text {
            font-size: 17px;
            font-weight: 700;
            line-height: 1.9;
            color: #0f172a;
            margin-bottom: 15px;
        }

        .answer {
            padding: 12px 15px;
            border-radius: 9px;
            margin-top: 10px;
            line-height: 1.8;
            font-size: 15px;
        }

        .wrong-answer {
            background: #fef2f2;
            color: #b91c1c;
        }

        .correct-answer {
            background: #f0fdf4;
            color: #15803d;
        }

        .all-correct {
            background: #f0fdf4;
            color: #15803d;
            border-radius: 14px;
            padding: 22px;
            text-align: center;
            font-weight: 700;
            line-height: 2;
        }

        .restart-btn {
            margin-top: 25px;
            background: #2563eb;
            color: white;
            padding: 13px 35px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 23px;
            }

            .card {
                padding: 20px;
            }

            .question {
                font-size: 18px;
            }

            .navigation {
                flex-direction: column;
            }

            .nav-btn {
                width: 100%;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>اختبار قصير</h1>
    <p>الخوارزميات و المنطق</p>

    <div class="timer" id="timer">
        10:00
    </div>
</header>

<div class="container">

    <!-- شاشة البداية -->
    <div class="card start-card" id="start">

        <h2>مرحبًا بك في الاختبار 👋</h2>

        <p>
            اختبار قصير يتكون من 20 سؤالًا من نوع الاختيار من متعدد.
            <br>
            لديك 10 دقائق للإجابة عن جميع الأسئلة.
        </p>

        <input
            type="text"
            id="studentName"
            placeholder="اكتب اسم الطالب"
        >

        <button class="start-btn" onclick="startQuiz()">
            بدء الاختبار
        </button>

    </div>


    <!-- الاختبار -->
    <div class="card" id="quiz">

        <div class="progress-container">

            <div class="progress-info">
                <span id="questionNumber">
                    السؤال 1 من 20
                </span>

                <span id="answeredCount">
                    0 / 20
                </span>
            </div>

            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>

        </div>

        <div id="question" class="question"></div>

        <div id="options" class="options"></div>

        <div class="navigation">

            <button
                class="nav-btn"
                id="prevBtn"
                onclick="previousQuestion()"
            >
                السابق
            </button>

            <button
                class="nav-btn next-btn"
                id="nextBtn"
                onclick="nextQuestion()"
            >
                التالي
            </button>

            <button
                class="nav-btn finish-btn"
                id="finishBtn"
                onclick="finishQuiz()"
                style="display:none;"
            >
                إنهاء الاختبار
            </button>

        </div>

    </div>


    <!-- النتيجة -->
    <div class="card result-card" id="result">

        <h2>نتيجة الاختبار 🎯</h2>

        <div class="score-circle">
            <span id="score">0 / 20</span>
            <span>الدرجة</span>
        </div>

        <div class="percentage">
            النسبة:
            <span id="percentage">0%</span>
        </div>

        <div class="stats">

            <div class="stat correct">
                <strong id="correct">0</strong>
                <span>إجابة صحيحة</span>
            </div>

            <div class="stat wrong">
                <strong id="wrong">0</strong>
                <span>إجابة خاطئة</span>
            </div>

        </div>

        <p id="resultMessage"></p>

        <!-- الأسئلة التي أخطأ فيها الطالب -->
        <div id="wrongQuestions"></div>

        <button
            class="restart-btn"
            onclick="restartQuiz()"
        >
            إعادة الاختبار
        </button>

    </div>

</div>

<footer>
    جميع الحقوق محفوظة © Reem Alanazi
</footer>


<script>

    /* =========================
       بنك الأسئلة
    ========================= */

    const questions = [

        {
            q: "ما المقصود بالبيانات؟",
            o: [
                "معلومات تمت معالجتها",
                "حقائق خام لم تتم معالجتها",
                "نتائج نهائية",
                "برامج الحاسب"
            ],
            a: 1
        },

        {
            q: "ما المقصود بالمعلومات؟",
            o: [
                "بيانات خام",
                "أرقام فقط",
                "بيانات تمت معالجتها وأصبح لها معنى",
                "أوامر الحاسب"
            ],
            a: 2
        },

        {
            q: "أي مما يلي يُعد من أنواع البيانات؟",
            o: [
                "البيانات الرقمية",
                "البيانات النصية",
                "البيانات الصوتية",
                "جميع ما سبق"
            ],
            a: 3
        },

        {
            q: "ما أصغر وحدة لتمثيل البيانات في الحاسب؟",
            o: [
                "البايت",
                "البت",
                "الكيلوبايت",
                "الميجابايت"
            ],
            a: 1
        },

        {
            q: "ما القيمة التي يمكن أن يمثلها البت؟",
            o: [
                "0 أو 1",
                "0 إلى 9",
                "1 إلى 10",
                "أي حرف"
            ],
            a: 0
        },

        {
            q: "أي نظام عددي يستخدمه الحاسب لتمثيل البيانات؟",
            o: [
                "العشري",
                "الثنائي",
                "الثماني فقط",
                "السداسي عشري فقط"
            ],
            a: 1
        },

        {
            q: "ما الوظيفة الأساسية لوحدة المعالجة المركزية؟",
            o: [
                "تخزين الملفات فقط",
                "عرض الصور",
                "تنفيذ التعليمات ومعالجة البيانات",
                "طباعة المستندات"
            ],
            a: 2
        },

        {
            q: "أي جزء من وحدة المعالجة المركزية ينفذ العمليات الحسابية والمنطقية؟",
            o: [
                "وحدة التحكم",
                "وحدة الحساب والمنطق",
                "الذاكرة",
                "القرص الصلب"
            ],
            a: 1
        },

        {
            q: "ما وظيفة وحدة التحكم؟",
            o: [
                "تنفيذ العمليات الحسابية فقط",
                "تخزين الملفات",
                "تنظيم وتنسيق تنفيذ التعليمات",
                "طباعة النتائج"
            ],
            a: 2
        },

        {
            q: "أي مما يلي يُعد من وحدات التخزين؟",
            o: [
                "القرص الصلب",
                "لوحة المفاتيح",
                "الفأرة",
                "الشاشة"
            ],
            a: 0
        },

        {
            q: "أي وحدة تخزين أكبر من الكيلوبايت؟",
            o: [
                "البت",
                "البايت",
                "الميجابايت",
                "لا شيء مما سبق"
            ],
            a: 2
        },

        {
            q: "كم بت يتكون منها البايت الواحد؟",
            o: [
                "4",
                "6",
                "8",
                "16"
            ],
            a: 2
        },

        {
            q: "أي مما يلي يُعد مثالًا على لغة برمجة؟",
            o: [
                "Python",
                "Windows",
                "Word",
                "Chrome"
            ],
            a: 0
        },

        {
            q: "ما المقصود بالخوارزمية؟",
            o: [
                "جهاز لتخزين البيانات",
                "مجموعة خطوات مرتبة لحل مشكلة",
                "لغة لتصميم الصور",
                "نوع من أنواع الذاكرة"
            ],
            a: 1
        },

        {
            q: "ما أول خطوة في حل المشكلة باستخدام الخوارزمية؟",
            o: [
                "تحديد المشكلة",
                "كتابة النتيجة",
                "طباعة البرنامج",
                "إغلاق الحاسب"
            ],
            a: 0
        },

        {
            q: "أي مما يلي يمثل تسلسلًا منطقيًا لحل المشكلة؟",
            o: [
                "تحديد المشكلة ثم تحديد الحل ثم تنفيذ الخطوات",
                "تنفيذ الخطوات ثم تحديد المشكلة",
                "كتابة النتيجة ثم البحث عن المشكلة",
                "تشغيل الحاسب فقط"
            ],
            a: 0
        },

        {
            q: "ما الغرض من استخدام المخطط الانسيابي؟",
            o: [
                "تخزين الملفات",
                "تمثيل خطوات حل المشكلة بشكل مرئي",
                "زيادة سرعة الإنترنت",
                "حماية الحاسب"
            ],
            a: 1
        },

        {
            q: "أي شكل يستخدم عادةً للدلالة على بداية ونهاية المخطط الانسيابي؟",
            o: [
                "المستطيل",
                "المعين",
                "الشكل البيضاوي",
                "السهم"
            ],
            a: 2
        },

        {
            q: "أي شكل يستخدم عادةً لتمثيل عملية في المخطط الانسيابي؟",
            o: [
                "المستطيل",
                "المعين",
                "الدائرة",
                "الشكل البيضاوي"
            ],
            a: 0
        },

        {
            q: "أي شكل يستخدم عادةً لتمثيل اتخاذ قرار في المخطط الانسيابي؟",
            o: [
                "المستطيل",
                "المعين",
                "الشكل البيضاوي",
                "السهم"
            ],
            a: 1
        }

    ];


    /* =========================
       المتغيرات
    ========================= */

    let currentQuestion = 0;
    let answers = [];
    let studentName = "";

    let timeLeft = 600;
    let timerInterval;


    /* =========================
       بدء الاختبار
    ========================= */

    function startQuiz() {

        studentName =
            document.getElementById("studentName").value.trim();

        if (studentName === "") {
            alert("فضلاً اكتب اسم الطالب أولاً.");
            return;
        }

        document.getElementById("start").style.display = "none";
        document.getElementById("quiz").style.display = "block";

        currentQuestion = 0;
        answers = [];

        timeLeft = 600;

        startTimer();
        showQuestion();

    }


    /* =========================
       المؤقت
    ========================= */

    function startTimer() {

        clearInterval(timerInterval);

        updateTimer();

        timerInterval = setInterval(() => {

            timeLeft--;

            updateTimer();

            if (timeLeft <= 0) {

                clearInterval(timerInterval);

                alert("انتهى وقت الاختبار.");

                finishQuiz();

            }

        }, 1000);

    }


    function updateTimer() {

        const minutes =
            Math.floor(timeLeft / 60);

        const seconds =
            timeLeft % 60;

        document.getElementById("timer").textContent =
            `${minutes}:${seconds.toString().padStart(2, "0")}`;

    }


    /* =========================
       عرض السؤال
    ========================= */

    function showQuestion() {

        const question = questions[currentQuestion];

        document.getElementById("question").textContent =
            question.q;

        document.getElementById("questionNumber").textContent =
            `السؤال ${currentQuestion + 1} من ${questions.length}`;

        document.getElementById("answeredCount").textContent =
            `${answers.filter(a => a !== undefined).length} / ${questions.length}`;

        document.getElementById("progress").style.width =
            `${((currentQuestion + 1) / questions.length) * 100}%`;


        const optionsContainer =
            document.getElementById("options");

        optionsContainer.innerHTML = "";


        question.o.forEach((option, index) => {

            const optionElement =
                document.createElement("div");

            optionElement.className = "option";

            optionElement.textContent =
                `${String.fromCharCode(1571 + index)}) ${option}`;

            if (answers[currentQuestion] === index) {
                optionElement.classList.add("selected");
            }

            optionElement.onclick = () => {

                answers[currentQuestion] = index;

                showQuestion();

            };

            optionsContainer.appendChild(optionElement);

        });


        /* زر السابق */

        document.getElementById("prevBtn").disabled =
            currentQuestion === 0;


        /* أزرار التالي والإنهاء */

        if (currentQuestion === questions.length - 1) {

            document.getElementById("nextBtn").style.display =
                "none";

            document.getElementById("finishBtn").style.display =
                "block";

        } else {

            document.getElementById("nextBtn").style.display =
                "block";

            document.getElementById("finishBtn").style.display =
                "none";

        }

    }


    /* =========================
       السؤال التالي
    ========================= */

    function nextQuestion() {

        if (currentQuestion < questions.length - 1) {

            currentQuestion++;

            showQuestion();

        }

    }


    /* =========================
       السؤال السابق
    ========================= */

    function previousQuestion() {

        if (currentQuestion > 0) {

            currentQuestion--;

            showQuestion();

        }

    }


    /* =========================
       إنهاء الاختبار وعرض الأخطاء
    ========================= */

    function finishQuiz() {

        clearInterval(timerInterval);

        let correct = 0;
        let wrong = 0;

        let wrongQuestions = [];


        questions.forEach((question, index) => {

            const userAnswer = answers[index];


            /* الإجابة صحيحة */

            if (userAnswer === question.a) {

                correct++;

            }

            /* الإجابة خاطئة أو لم تتم الإجابة */

            else {

                wrong++;

                wrongQuestions.push({

                    number: index + 1,

                    question: question.q,

                    userAnswer:
                        userAnswer !== undefined
                            ? question.o[userAnswer]
                            : "لم تتم الإجابة",

                    correctAnswer:
                        question.o[question.a]

                });

            }

        });


        const total = questions.length;

        const percentage =
            Math.round((correct / total) * 100);


        /* إخفاء الاختبار */

        document.getElementById("quiz").style.display =
            "none";


        /* إظهار النتيجة */

        document.getElementById("result").style.display =
            "block";


        /* معلومات النتيجة */

        document.getElementById("score").textContent =
            `${correct} / ${total}`;

        document.getElementById("percentage").textContent =
            `${percentage}%`;

        document.getElementById("correct").textContent =
            correct;

        document.getElementById("wrong").textContent =
            wrong;


        /* رسالة النتيجة */

        let message = "";

        if (percentage >= 90) {

            message =
                `ممتاز جدًا يا ${studentName}! 🎉`;

        } else if (percentage >= 80) {

            message =
                `أداء رائع يا ${studentName}! 👏`;

        } else if (percentage >= 60) {

            message =
                `جيد يا ${studentName}، ويمكنك تحسين نتيجتك أكثر 👍`;

        } else {

            message =
                `تحتاج إلى مراجعة بعض المفاهيم يا ${studentName} 📚`;

        }


        document.getElementById("resultMessage").textContent =
            message;


        /* =========================
           عرض الأسئلة الخاطئة
        ========================= */

        const wrongContainer =
            document.getElementById("wrongQuestions");


        if (wrongQuestions.length === 0) {

            wrongContainer.innerHTML = `

                <div class="all-correct">

                    🎉 أحسنت!

                    <br>

                    لم تخطئ في أي سؤال،
                    جميع إجاباتك صحيحة.

                </div>

            `;

        } else {

            wrongContainer.innerHTML = `

                <h3 class="wrong-title">
                    🔴 الأسئلة التي أخطأت فيها
                </h3>

                ${wrongQuestions.map(item => `

                    <div class="wrong-question">

                        <div class="question-number">
                            السؤال ${item.number}
                        </div>

                        <div class="question-text">
                            ${item.question}
                        </div>

                        <div class="answer wrong-answer">
                            ❌ إجابتك:
                            <strong>
                                ${item.userAnswer}
                            </strong>
                        </div>

                        <div class="answer correct-answer">
                            ✅ الإجابة الصحيحة:
                            <strong>
                                ${item.correctAnswer}
                            </strong>
                        </div>

                    </div>

                `).join("")}

            `;

        }

    }


    /* =========================
       إعادة الاختبار
    ========================= */

    function restartQuiz() {

        clearInterval(timerInterval);

        currentQuestion = 0;
        answers = [];

        timeLeft = 600;

        document.getElementById("result").style.display =
            "none";

        document.getElementById("start").style.display =
            "block";

        document.getElementById("studentName").value =
            "";

        document.getElementById("timer").textContent =
            "10:00";

    }

</script>

</body>
</html>
